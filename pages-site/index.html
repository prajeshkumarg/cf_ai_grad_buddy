<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grad Study Buddy</title>
  <style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #191919; color: #e3e3e3; margin: 0; padding: 20px; }
  .container { background: #1e1e1e; border-radius: 16px; border: 1px solid #2f2f2f; width: 100%; max-width: 900px; height: calc(100vh - 40px); margin: 0 auto; display: flex; flex-direction: column; }
    header { padding: 20px 24px; border-bottom: 1px solid #2f2f2f; }
    header h1 { margin: 0 0 6px; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; background: #191919; }
    #messages { display: flex; flex-direction: column; gap: 16px; }
    .msg { display: flex; gap: 10px; }
    .msg .bubble { padding: 10px 14px; border-radius: 8px; max-width: 65%; white-space: pre-wrap; word-break: break-word; }
    .user .bubble { background: #2d6cdf; color: white; margin-left: auto; }
    .assistant .bubble { background: #2f2f2f; border: 1px solid #3a3a3a; }
    .input { display: flex; gap: 10px; padding: 16px; border-top: 1px solid #2f2f2f; }
    .input input { flex: 1; background: #252525; color: #e3e3e3; border: 1px solid #3a3a3a; border-radius: 8px; padding: 10px 14px; }
    .input button { background: #2d6cdf; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }

    /* Loading dots */
    .loading { display: inline-flex; gap: 4px; align-items: center; }
    .loading .dot { width: 6px; height: 6px; border-radius: 50%; background: #9b9b9b; animation: dotPulse 1.4s infinite; }
    .loading .dot:nth-child(2) { animation-delay: 0.2s; }
    .loading .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.35; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
  <!-- Optional: override API base by injecting a script before this with: window.API_BASE = 'https://your-worker-subdomain.workers.dev'; -->
  <script>
    // Infer API base:
    // 1) Explicit window.API_BASE if provided by a small inline script above
    // 2) ?api=https://example.workers.dev (URL param override)
    // 3) Default to local on localhost; otherwise default to deployed Worker URL
    (function() {
      const urlApi = new URLSearchParams(location.search).get('api');
      const isLocalHost = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
      const prodDefault = 'https://grad-buddy-api.prajeshkumarg.workers.dev';
      const localDefault = isLocalHost ? 'http://127.0.0.1:8787' : prodDefault;
      window.API_BASE = window.API_BASE || urlApi || localDefault;
    })();
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 Grad Study Buddy</h1>
  <div>Frontend hosted on Cloudflare Pages, API served by Cloudflare Workers</div>
    </header>
    <div id="chat">
      <div id="messages"></div>
    </div>
    <div class="input">
  <input id="user-input" placeholder="Ask me anything about your studies..." />
  <button id="send-btn" type="button">Send</button>
  <button id="clear-btn" type="button" style="background:#3a3a3a">Clear</button>
    </div>
    <div class="tips" style="padding:12px 16px;border-top:1px solid #2f2f2f;background:#1e1e1e;color:#9b9b9b;font-size:13px;">
      💡 Try: “Explain Dynamic Programming” • “Quiz me on Linear Algebra” • “What’s the math behind gradient descent?”
    </div>
  </div>
  <script>
  const API = window.API_BASE;
    const messagesEl = document.getElementById('messages');
    const chatEl = document.getElementById('chat'); // the scrolling container
    const inputEl = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const clearBtn = document.getElementById('clear-btn');

    let userId = localStorage.getItem('studyAssistantUserId');
    if (!userId) {
      userId = 'user_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
      localStorage.setItem('studyAssistantUserId', userId);
    }

    function addMsg(text, role) {
      const row = document.createElement('div');
      row.className = 'msg ' + role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    // Loading indicator while assistant is thinking
    let loadingRow = null;
    function showLoading() {
      if (loadingRow) return; // prevent duplicates
      const row = document.createElement('div');
      row.className = 'msg assistant';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<span class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
      loadingRow = row;
    }
    function removeLoading() {
      if (loadingRow) {
        loadingRow.remove();
        loadingRow = null;
      }
    }

    // Parses a Server-Sent Events stream from the Worker and calls
    // onEvent(name, data) for each complete event.
    async function readEventStream(res, onEvent) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      const dispatch = (raw) => {
        let event = 'message', data = '';
        for (const line of raw.split('\n')) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (data) onEvent(event, JSON.parse(data));
      };
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true }).replace(/\r/g, '');
        let end;
        while ((end = buffer.indexOf('\n\n')) !== -1) {
          dispatch(buffer.slice(0, end));
          buffer = buffer.slice(end + 2);
        }
      }
      if (buffer.trim()) dispatch(buffer);
    }

    async function send() {
      const msg = inputEl.value.trim();
      if (!msg) return;
      if (!API) { addMsg('API not configured. Set window.API_BASE or add ?api=https://your-worker.workers.dev to the URL.', 'assistant'); return; }
      addMsg(msg, 'user');
      inputEl.value = '';
      sendBtn.disabled = true;
      showLoading();
      let bubble = null; // assistant bubble, created on the first token
      try {
        const res = await fetch(API + '/api/chat/stream', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, userId })
        });
        const type = res.headers.get('Content-Type') || '';
        if (!res.ok || !type.includes('text/event-stream') || !res.body) {
          const data = await res.json().catch(() => null);
          removeLoading();
          addMsg('Error: ' + (data && data.error || ('HTTP ' + res.status)), 'assistant');
          return;
        }
        await readEventStream(res, (event, data) => {
          if (event === 'token') {
            if (!bubble) {
              removeLoading();
              addMsg('', 'assistant');
              bubble = messagesEl.lastElementChild.querySelector('.bubble');
            }
            bubble.textContent += data.token;
            chatEl.scrollTop = chatEl.scrollHeight;
          } else if (event === 'error') {
            removeLoading();
            addMsg('Error: ' + data.error, 'assistant');
          }
        });
        removeLoading();
      } catch (e) {
        removeLoading();
        addMsg('Network error talking to API at ' + API, 'assistant');
        console.error(e);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    async function clearChat() {
      messagesEl.innerHTML = '';
      addMsg("Hi! I'm your study assistant. What would you like to study today?", 'assistant');
      try {
        await fetch(API + '/api/clear', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });
      } catch (e) { console.warn('Clear failed', e); }
    }

    sendBtn.addEventListener('click', send);
  // Trigger send on Enter for reliability across browsers
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
    clearBtn.addEventListener('click', clearChat);

    addMsg("Hi! I'm your study assistant powered by Cloudflare Workers AI.", 'assistant');
    inputEl.focus();
  </script>
</body>
</html>
